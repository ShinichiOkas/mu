[project]
name = "mu"
version = "0.0.1"
description = "きわめてミニマルな汎用エージェント"
requires-python = ">=3.11"
dependencies = [
  "ollama>=0.6",
  "httpx>=0.27",  # l0.py が例外型・Timeout を直接使う（ollama の基盤でもある）
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]  # temp/（L3 実走の使い捨て場）の生成物テストを収集しない
markers = [
  "live: 実 Ollama への接続を要するテスト（サーバ未起動ならスキップ）",
]
